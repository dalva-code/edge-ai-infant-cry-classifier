paths:
  data_root: ./data
  raw: ./data/raw
  processed: ./data/processed
  features: ./data/features
  public: ./data/public
  models: ./models
  results: ./results
  labels_csv: ./labels.csv

audio:
  sample_rate: 48000
  mono: true
  target_lufs: -23

features:
  n_mels: 64
  n_mfcc: 20
  win_length_ms: 25
  hop_length_ms: 10

training:
  batch_size: 32
  lr: 0.001
  epochs: 20
  seed: 42
  num_workers: 2

model:
  cnn_hidden: 64
  dropout: 0.2

thresholds:
  abstain: 0.65
